name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build:
    name: Android64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v6.0.0-alpha.1
          target: Android64
          bindings: TheSillyDoggo/bindings
          combine: true
          cli: latest

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-android64
          path: '*.geode'
